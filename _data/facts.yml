# Every figure on the site lives here. Pages render it with the fact include and never retype it.
# label = what it measures. value = the phrase used in prose. short = compact form for stat displays.
# as_of = the date the figure was measured, counted or last stated. claim and status point at the claims register.
# qualifier is required for status Q and is shown with the figure.

